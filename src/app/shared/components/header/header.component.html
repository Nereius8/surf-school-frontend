<nav class="sticky top-0 z-50 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-100 dark:border-slate-800 shadow-sm transition-colors duration-300">
  <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8">
    <div class="flex justify-between h-14 sm:h-16 items-center">
      
      <!-- LOGO -->
      <button (click)="scrollTo('hero')" class="flex items-center space-x-2 sm:space-x-3 cursor-pointer group text-left">
        <img 
          src="images/logo.jpg" 
          alt="JOFAN Surf School Logo" 
          class="h-8 sm:h-9 w-auto transition-transform group-hover:scale-110 duration-200 object-contain"
        />
        <div class="flex flex-col">
          <span class="text-lg sm:text-xl font-black tracking-wider text-slate-950 dark:text-white leading-none">JOFAN</span>
          <span class="text-[10px] sm:text-xs font-medium text-cyan-600 dark:text-cyan-400 tracking-wide">Surf School</span>
        </div>
      </button>
      
      <!-- MENÚ ESCRITORIO (>= md) -->
      <ul class="hidden md:flex items-center space-x-1 lg:space-x-4 text-sm font-medium text-slate-600 dark:text-slate-300">
        <li><button (click)="scrollTo('hero')" class="px-3 py-2 hover:text-cyan-600 dark:hover:text-cyan-400 transition-colors">{{ 'NAVBAR.HOME' | translate }}</button></li>
        <li><button (click)="scrollTo('lessons')" class="px-3 py-2 hover:text-cyan-600 dark:hover:text-cyan-400 transition-colors">{{ 'NAVBAR.LESSONS' | translate }}</button></li>
        <li><button (click)="scrollTo('rental')" class="px-3 py-2 hover:text-cyan-600 dark:hover:text-cyan-400 transition-colors">{{ 'NAVBAR.RENTAL' | translate }}</button></li>
        <li><button (click)="scrollTo('transport')" class="px-3 py-2 hover:text-cyan-600 dark:hover:text-cyan-400 transition-colors">{{ 'NAVBAR.TRANSPORT' | translate }}</button></li>
        <li><button (click)="scrollTo('location')" class="px-3 py-2 hover:text-cyan-600 dark:hover:text-cyan-400 transition-colors">{{ 'NAVBAR.LOCATION' | translate }}</button></li>
      </ul>
      
      <!-- CONTROLES ESCRITORIO (>= md) -->
      <div class="hidden md:flex items-center gap-3">
        <button (click)="toggleTheme()" type="button" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
          {{ isDarkMode ? '☀️' : '🌙' }}
        </button>

        <div class="flex items-center bg-slate-100 dark:bg-slate-800 p-1 rounded-xl text-xs font-bold">
          <button (click)="switchLanguage('es')" type="button" [class]="currentLang === 'es' ? 'bg-white dark:bg-slate-700 text-cyan-600 shadow-sm' : 'text-slate-500'" class="px-2 py-1 rounded-lg transition-all">ES</button>
          <button (click)="switchLanguage('en')" type="button" [class]="currentLang === 'en' ? 'bg-white dark:bg-slate-700 text-cyan-600 shadow-sm' : 'text-slate-500'" class="px-2 py-1 rounded-lg transition-all">EN</button>
        </div>

        <a href="https://wa.me/6281918110376?text={{ 'WHATSAPP.BOOK_LESSON' | translate }}" 
           target="_blank" 
           class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-5 py-2.5 rounded-xl text-xs uppercase tracking-wider transition-all shadow-md active:scale-95 flex items-center gap-1.5">
          <span>BOOK NOW</span>
        </a>
      </div>

      <!-- CONTROLES MÓVIL (< md) VISIBLES EN HEADER -->
      <div class="flex items-center md:hidden gap-1.5">
        <!-- Selector Idioma Móvil Directo -->
        <div class="flex items-center bg-slate-100 dark:bg-slate-800 p-0.5 rounded-lg text-[11px] font-bold">
          <button (click)="switchLanguage('es')" type="button" [class]="currentLang === 'es' ? 'bg-white dark:bg-slate-700 text-cyan-600 shadow-xs' : 'text-slate-500 dark:text-slate-400'" class="px-2 py-1 rounded-md transition-all">ES</button>
          <button (click)="switchLanguage('en')" type="button" [class]="currentLang === 'en' ? 'bg-white dark:bg-slate-700 text-cyan-600 shadow-xs' : 'text-slate-500 dark:text-slate-400'" class="px-2 py-1 rounded-md transition-all">EN</button>
        </div>

        <!-- Modo Oscuro Móvil -->
        <button (click)="toggleTheme()" type="button" class="p-1.5 text-lg rounded-lg text-slate-700 dark:text-slate-200">
          {{ isDarkMode ? '☀️' : '🌙' }}
        </button>

        <!-- Botón Hamburguesa -->
        <button (click)="toggleMenu()" type="button" class="text-slate-700 dark:text-slate-200 p-1.5 rounded-lg">
          @if (!isMenuOpen) {
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          } @else {
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          }
        </button>
      </div>

    </div>
  </div>

  <!-- MENÚ DESPLEGABLE MÓVIL -->
  @if (isMenuOpen) {
    <div class="md:hidden bg-white dark:bg-slate-900 border-t border-slate-100 dark:border-slate-800 px-4 pt-3 pb-5 space-y-3">
      <ul class="flex flex-col space-y-2 font-medium text-slate-700 dark:text-slate-200 text-base">
        <li><button (click)="scrollTo('hero'); " class="w-full text-left py-2 border-b border-slate-50 dark:border-slate-800 hover:text-cyan-600">{{ 'NAVBAR.HOME' | translate }}</button></li>
        <li><button (click)="scrollTo('lessons'); " class="w-full text-left py-2 border-b border-slate-50 dark:border-slate-800 hover:text-cyan-600">{{ 'NAVBAR.LESSONS' | translate }}</button></li>
        <li><button (click)="scrollTo('rental'); " class="w-full text-left py-2 border-b border-slate-50 dark:border-slate-800 hover:text-cyan-600">{{ 'NAVBAR.RENTAL' | translate }}</button></li>
        <li><button (click)="scrollTo('transport'); " class="w-full text-left py-2 border-b border-slate-50 dark:border-slate-800 hover:text-cyan-600">{{ 'NAVBAR.TRANSPORT' | translate }}</button></li>
        <li><button (click)="scrollTo('location'); " class="w-full text-left py-2 hover:text-cyan-600">{{ 'NAVBAR.LOCATION' | translate }}</button></li>
      </ul>

      <div class="pt-2 flex items-center justify-center">
        <a href="https://wa.me/6281918110376?text={{ 'WHATSAPP.BOOK_LESSON' | translate }}" 
           target="_blank" 
           (click)="isMenuOpen = false"
           class="w-full text-center bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-5 py-3 rounded-xl text-sm uppercase tracking-wider transition-all shadow-md active:scale-95">
          BOOK NOW
        </a>
      </div>
    </div>
  }
</nav>
