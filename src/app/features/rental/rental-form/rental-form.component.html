<!-- Botón para alternar la visibilidad del formulario -->
<button (click)="toggleForm()" class="btn-toggle" style="margin-bottom: 20px; padding: 10px 20px; border-radius: 8px; cursor: pointer;">
    {{ showForm() ? 'Cancel' : '+ Add New Surfboard' }}
  </button>
  
  <!-- Flujo de control nativo de Angular 19 -->
  @if (showForm()) {
    <form (ngSubmit)="onSubmit()" #boardForm="ngForm" class="form-container" style="background: #f8fafc; padding: 24px; border-radius: 16px; border: 1px solid #e2e8f0; max-width: 500px;">
      
      <!-- Model Input -->
      <div style="margin-bottom: 16px;">
        <label style="display: block; margin-bottom: 6px; font-weight: 600;">Surfboard Model</label>
        <input type="text" name="model" [(ngModel)]="newBoard.model" required placeholder="e.g. Catch Surf Odysea" style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px;">
      </div>
  
      <!-- Type / Category Select -->
      <div style="margin-bottom: 16px;">
        <label style="display: block; margin-bottom: 6px; font-weight: 600;">Board Type</label>
        <select name="type" [(ngModel)]="newBoard.type" style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px;">
          <option value="Softboard Blue/Orange">Softboard (Beginner)</option>
          <option value="Malibu/Funboard">Malibu / Funboard</option>
          <option value="Shortboard">Shortboard (Advanced)</option>
          <option value="Longboard">Longboard (Classic)</option>
        </select>
      </div>
  
      <!-- Size Input -->
      <div style="margin-bottom: 16px;">
        <label style="display: block; margin-bottom: 6px; font-weight: 600;">Size</label>
        <input type="text" name="size" [(ngModel)]="newBoard.size" required placeholder="e.g. 7'0&quot;" style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px;">
      </div>
  
      <!-- Price Input (Usando los precios que ya tienes definidos) -->
      <div style="margin-bottom: 16px;">
        <label style="display: block; margin-bottom: 6px; font-weight: 600;">Rental Price per Hour ($)</label>
        <input type="number" name="rentalPricePerHour" [(ngModel)]="newBoard.rentalPricePerHour" required style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px;">
      </div>
  
      <!-- Submit Button -->
      <button type="submit" [disabled]="!boardForm.form.valid" style="width: 100%; padding: 10px; background: #0284c7; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">
        Save Surfboard
      </button>
  
    </form>
  }
