<nav class="jofan-navbar">
    <div class="jofan-logo">
      <div class="jofan-logo-icon">🏄‍♀️</div>
      <div>
        <span class="jofan-logo-text">JOFAN</span>
        <span class="jofan-logo-sub">SURF SCHOOL</span>
      </div>
    </div>
    <button (click)="toggleForm()" class="btn btn-primary">
      {{ showForm() ? 'Cerrar Registro' : 'Nueva Tabla' }}
    </button>
  </nav>
  
  <div *ngIf="showForm()" class="form-card" style="margin-top: 20px;">
    <h2 class="form-title">Añadir Nueva Tabla al Stock</h2>
    <form (ngSubmit)="onSubmit()" class="grid-form">
      <div class="form-group">
        <label class="form-label">Modelo / Nombre</label>
        <input type="text" [(ngModel)]="newBoard.model" name="model" placeholder="Ej: Jofan Classic" required class="form-input">
      </div>
      <div class="form-group">
        <label class="form-label">Tipo de Tabla</label>
        <select [(ngModel)]="newBoard.type" name="type" required class="form-input">
          <option value="Softboard Blue/Orange">Softboard (Azul / Naranja)</option>
          <option value="Softboard White/Blue">Softboard (Blanca / Azul)</option>
          <option value="Shortboard">Shortboard</option>
          <option value="Longboard">Longboard</option>
          <option value="Evolution">Evolutiva</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Medida (Pies)</label>
        <input type="number" step="0.1" [(ngModel)]="newBoard.size" name="size" required class="form-input">
      </div>
      <div class="form-group" style="flex-direction: row; gap: 10px; align-items: flex-end;">
        <div style="flex-grow: 1; display: flex; flex-direction: column;">
          <label class="form-label">Precio Alquiler (Hora)</label>
          <input type="number" [(ngModel)]="newBoard.rentalPricePerHour" name="price" required class="form-input">
        </div>
        <button type="submit" class="btn btn-primary">Registrar</button>
      </div>
    </form>
  </div>
